<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora</title>
<style>
  :root {
    --fondo: #e6eefa;
    --superficie: #fffdfb;
    --texto: #22344d;
    --suave: #5f7390;
    --borde: #c3d3ea;
    --acento: #3f6db3;
    --acento-texto: #ffffff;
    --naranja: #f0a267;
    --naranja-texto: #3b2412;
    --resultado: #fdebd9;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fondo: #14202f;
      --superficie: #1c2c42;
      --texto: #e8eef7;
      --suave: #9fb2cc;
      --borde: #36506f;
      --acento: #8fb6ec;
      --acento-texto: #10213a;
      --naranja: #f0a96b;
      --naranja-texto: #2d1a0c;
      --resultado: #3a2a1d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --fondo: #14202f; --superficie: #1c2c42; --texto: #e8eef7; --suave: #9fb2cc;
    --borde: #36506f; --acento: #8fb6ec; --acento-texto: #10213a; --naranja: #f0a96b; --naranja-texto: #2d1a0c; --resultado: #3a2a1d;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1rem;
    background: var(--fondo);
    color: var(--texto);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  main {
    width: 100%;
    max-width: 26rem;
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 14px;
    border-top: 5px solid var(--naranja);
    padding: 1.75rem;
  }
  h1 { margin: 0 0 .25rem; font-size: 1.6rem; color: var(--acento); }
  p.ayuda { margin: 0 0 1.25rem; color: var(--suave); font-size: .95rem; }
  label { display: block; margin: 0 0 .35rem; font-size: .9rem; color: var(--suave); }
  input, select {
    width: 100%;
    padding: .7rem .8rem;
    font: inherit;
    font-size: 1.1rem;
    color: var(--texto);
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 8px;
    margin-bottom: 1rem;
  }
  input:focus-visible, select:focus-visible {
    outline: 3px solid var(--acento);
    outline-offset: 1px;
  }
  #resultado {
    background: var(--resultado);
    border-color: var(--naranja);
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0;
  }
  .btn-tercero {
    width: 100%;
    padding: .65rem .8rem;
    margin-bottom: 1rem;
    font: inherit;
    font-size: 1rem;
    color: var(--naranja-texto);
    background: var(--naranja);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-tercero:hover { filter: brightness(.95); }
  .btn-tercero:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Calculadora</h1>
  <p class="ayuda">Escribe los números y elige la operación.</p>

  <label for="num1">Primer número</label>
  <input type="number" id="num1" placeholder="0" step="any">

  <label for="num2">Segundo número</label>
  <input type="number" id="num2" placeholder="0" step="any">

  <div id="grupo3" hidden>
    <label for="num3">Tercer número</label>
    <input type="number" id="num3" placeholder="0" step="any">
  </div>
  <button type="button" id="btnTercero" class="btn-tercero">Añadir tercer número</button>

  <label for="operacion">Operación</label>
  <select id="operacion">
    <option value="">Elige una operación</option>
    <option value="suma">Suma (+)</option>
    <option value="resta">Resta (−)</option>
    <option value="multiplicacion">Multiplicación (×)</option>
    <option value="division">División (÷)</option>
  </select>

  <label for="resultado">Resultado</label>
  <input type="text" id="resultado" readonly placeholder="—">
</main>

<script>
  const num1 = document.getElementById("num1");
  const num2 = document.getElementById("num2");
  const num3 = document.getElementById("num3");
  const grupo3 = document.getElementById("grupo3");
  const btnTercero = document.getElementById("btnTercero");
  const operacion = document.getElementById("operacion");
  const resultado = document.getElementById("resultado");

  function calcular() {
    const a = parseFloat(num1.value);
    const b = parseFloat(num2.value);
    const c = parseFloat(num3.value);

    if (operacion.value === "") {
      resultado.value = "";
      return;
    }
    const usaTercero = !grupo3.hidden;
    if (isNaN(a) || isNaN(b) || (usaTercero && isNaN(c))) {
      resultado.value = "Escribe todos los números";
      return;
    }

    // Aplica la operación elegida de izquierda a derecha: a op b (op c)
    const numeros = usaTercero ? [a, b, c] : [a, b];
    let r = numeros[0];
    for (let i = 1; i < numeros.length; i++) {
      const n = numeros[i];
      if (operacion.value === "suma") r += n;
      else if (operacion.value === "resta") r -= n;
      else if (operacion.value === "multiplicacion") r *= n;
      else if (operacion.value === "division") {
        if (n === 0) {
          resultado.value = "No se puede dividir entre 0";
          return;
        }
        r /= n;
      }
    }
    // Evita decimales largos como 0.30000000000000004
    resultado.value = Math.round(r * 1e10) / 1e10;
  }

  operacion.addEventListener("change", calcular);
  num1.addEventListener("input", calcular);
  num2.addEventListener("input", calcular);
  num3.addEventListener("input", calcular);

  btnTercero.addEventListener("click", () => {
    grupo3.hidden = !grupo3.hidden;
    btnTercero.textContent = grupo3.hidden ? "Añadir tercer número" : "Quitar tercer número";
    if (grupo3.hidden) num3.value = "";
    calcular();
  });
</script>
</body>
</html>
